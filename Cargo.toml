[workspace]
resolver = "2"
members = ["stacks", "stacks-primitives", "stacks-rpc", "stacks-tests"]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Max Karou <maxkarou@protonmail.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.81"
repository = "https://github.com/52/stacks-rs"
homepage = "https://github.com/52/stacks-rs"

[workspace.dependencies]
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
c32 = { version = "0.4", default-features = false, features = ["alloc"] }
const-hex = { version = "1.14", default-features = false, features = ["alloc"] }
lazy-regex = { version = "3.0", default-features = false, features = ["lite"] }
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
serde = { version = "1.0", default-features = false, features = ["alloc"] }
